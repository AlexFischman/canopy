<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canopy ontology viewer</title>
<style>
:root {
  --font: "Avenir Next", "Segoe UI Variable Text", "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --bar-h: 52px;
  --panel-w: 376px;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font: 13px/1.45 var(--font); color: var(--ink); background: var(--bg);
  overflow: hidden; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

#app { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: var(--bar-h) minmax(0, 1fr); height: 100vh; height: 100dvh; }

/* top bar */
#bar {
  grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 14px;
  background: var(--surface); border-bottom: 1px solid var(--line); position: relative; z-index: 20; min-width: 0;
}
.brand { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; margin-right: 2px; flex: none; }
.brand svg { width: 22px; height: 22px; display: block; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 8px;
  border: 1px solid transparent; background: none; white-space: nowrap; flex: none; line-height: 1;
}
.btn:hover { background: var(--surface2); }
.btn[aria-expanded="true"], .btn.on { background: var(--surface2); }
.btn.line { border-color: var(--line); background: var(--surface); }
.btn.line:hover { background: var(--surface2); }
.btn.primary { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn.icon { width: 32px; padding: 0; justify-content: center; }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn:disabled { opacity: .45; cursor: default; }
.btn:disabled:hover { background: none; }
#fileBtn { max-width: 250px; min-width: 0; flex: 0 1 auto; }
#fileBtn .fname { overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
#fileBtn .fmeta { color: var(--ink3); flex: none; }
.spacer { flex: 1 1 0; min-width: 0; }

#searchWrap { position: relative; flex: 1 1 320px; max-width: 520px; min-width: 120px; }
#search {
  width: 100%; height: 34px; border-radius: 9px; border: 1px solid transparent; background: var(--surface2);
  padding: 0 34px 0 34px; outline: none;
}
#search::placeholder { color: var(--ink3); }
#search:focus { border-color: var(--accent); background: var(--surface); }
#searchWrap > svg { position: absolute; left: 10px; top: 9px; width: 16px; height: 16px; color: var(--ink3); pointer-events: none; }
#searchWrap kbd { position: absolute; right: 8px; top: 7px; }
kbd {
  font: 11px/1 var(--font); color: var(--ink2); background: var(--surface); border: 1px solid var(--line); border-bottom-width: 2px;
  border-radius: 5px; padding: 3px 5px; min-width: 20px; text-align: center; display: inline-block;
}
#results {
  position: absolute; left: 0; right: 0; top: 40px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 11px; box-shadow: var(--shadow); max-height: min(64vh, 560px); overflow: auto; padding: 5px; min-width: 300px;
}
.res { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 2px 8px; padding: 6px 8px; border-radius: 7px; cursor: pointer; align-items: center; }
.res.active { background: var(--surface2); }
.res .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res .nm b { font-weight: 700; background: var(--match-bg); border-radius: 2px; }
.res .pth { grid-column: 2; color: var(--ink3); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res-note { padding: 8px 10px; color: var(--ink2); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; background: var(--ink3); }
.pglyph { width: 10px; height: 10px; display: inline-block; flex: none; border: 2px solid var(--rel); border-radius: 2px; transform: rotate(45deg) scale(.8); }
.pglyph.data { border-color: var(--restr); }
.iglyph { width: 9px; height: 9px; display: inline-block; flex: none; border: 2px solid var(--ink3); border-radius: 50%; background: var(--surface); }
.lnk .iglyph { margin-right: 6px; vertical-align: 0; }
.pglyph.other { border-color: var(--ink3); }

.seg { display: inline-flex; background: var(--surface2); border-radius: 9px; padding: 2px; flex: none; }
.seg button { height: 28px; padding: 0 11px; border: 0; background: none; border-radius: 7px; color: var(--ink2); line-height: 1; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(10, 20, 60, .14); }

/* popovers */
.pop {
  position: absolute; top: calc(var(--bar-h) - 4px); background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: var(--shadow); padding: 6px; min-width: 230px; z-index: 30;
}
.pop .item { display: flex; align-items: center; gap: 9px; width: 100%; height: 34px; padding: 0 10px; border: 0; background: none; border-radius: 7px; text-align: left; }
.pop .item:hover { background: var(--surface2); }
.pop .item svg { width: 16px; height: 16px; color: var(--ink2); flex: none; }
.pop .item .hint { margin-left: auto; color: var(--ink3); font-size: 12px; }
.pop h4 { margin: 8px 10px 4px; font-size: 12px; font-weight: 600; color: var(--ink2); }
.pop .row { display: flex; align-items: center; gap: 8px; padding: 5px 10px; }
.pop label.chk { display: flex; align-items: center; gap: 8px; padding: 5px 10px; border-radius: 7px; cursor: pointer; }
.pop label.chk:hover { background: var(--surface2); }
.pop label.chk .n { margin-left: auto; color: var(--ink3); font-size: 12px; }
.pop input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
.pop select { height: 28px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); padding: 0 6px; }
.pop hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px; }

/* stage */
#stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--bg); }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
#ctl { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; pointer-events: none; }
.group { display: inline-flex; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 2px; box-shadow: var(--shadow-s); pointer-events: auto; }
.group .btn { height: 28px; border-radius: 7px; padding: 0 8px; }
.group .btn.icon { width: 28px; padding: 0; }
.group .val { padding: 0 6px; min-width: 46px; text-align: center; color: var(--ink2); font-variant-numeric: tabular-nums; }
.group .lbl { padding: 0 4px 0 8px; color: var(--ink2); }
#mini { position: absolute; right: 12px; bottom: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow-s); cursor: pointer; touch-action: none; }
#tip {
  position: absolute; pointer-events: none; max-width: 320px; background: var(--ink); color: var(--bg); border-radius: 8px; padding: 6px 9px;
  font-size: 12px; line-height: 1.4; z-index: 10; box-shadow: var(--shadow-s);
}
#tip b { font-weight: 600; display: block; }
#tip span { opacity: .78; display: block; }
#focusBar { position: absolute; left: 12px; top: 12px; right: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; pointer-events: none; }
#focusBar .group { padding: 2px 4px 2px 10px; gap: 4px; min-height: 34px; }
#focusBar .ttl { font-weight: 600; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#focusBar .muted { color: var(--ink2); }
#hint {
  position: absolute; right: 12px; bottom: 12px; display: flex; align-items: center; gap: 10px; max-width: min(430px, calc(100% - 24px));
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 8px 8px 14px; box-shadow: var(--shadow-s);
}
#stage.hinted #mini { bottom: 84px; }
#hint p { margin: 0; color: var(--ink2); }
#hint p b { color: var(--ink); font-weight: 600; }
#empty { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; pointer-events: none; }
#empty div { max-width: 440px; text-align: center; pointer-events: auto; }
#empty h2 { font-size: 20px; margin: 0 0 8px; font-weight: 600; letter-spacing: -0.01em; }
#empty p { margin: 0 0 14px; color: var(--ink2); }

/* panel */
#panel { width: var(--panel-w); background: var(--surface); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; position: relative; z-index: 5; }
#app.nopanel #panel { display: none; }
#tabs { display: flex; gap: 2px; padding: 8px 10px 0; border-bottom: 1px solid var(--line); flex: none; }
#tabs button { border: 0; background: none; padding: 7px 10px 9px; color: var(--ink2); border-bottom: 2px solid transparent; margin-bottom: -1px; border-radius: 6px 6px 0 0; }
#tabs button[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
#tabs .n { color: var(--ink3); font-weight: 400; margin-left: 4px; }
#pbody { flex: 1; overflow: auto; padding: 16px 16px 28px; min-height: 0; overflow-wrap: anywhere; }
.kind { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--ink2); font-size: 12px; margin-bottom: 6px; }
.tag { display: inline-block; font-size: 11px; line-height: 1; padding: 3px 6px; border-radius: 5px; background: var(--surface2); color: var(--ink2); white-space: nowrap; }
.tag.warn { background: var(--restr-bg); color: var(--restr); }
.tag.rel { background: var(--rel-bg); color: var(--rel); }
h1.title { font-size: 21px; line-height: 1.2; font-weight: 600; letter-spacing: -0.015em; margin: 0 0 6px; }
.iri { font: 11.5px/1.45 var(--mono); color: var(--ink2); display: flex; gap: 6px; align-items: flex-start; }
.iri span { min-width: 0; }
.mini-btn { border: 0; background: none; padding: 2px; border-radius: 5px; color: var(--ink3); flex: none; line-height: 0; }
.mini-btn:hover { background: var(--surface2); color: var(--ink); }
.mini-btn svg { width: 14px; height: 14px; }
.crumbs { margin: 10px 0 0; color: var(--ink3); font-size: 12px; line-height: 1.7; }
.crumbs .sep { margin: 0 3px; }
.desc { margin: 12px 0 0; color: var(--ink); line-height: 1.55; white-space: pre-wrap; }
.desc + .desc { margin-top: 8px; }
.desc .lang { color: var(--ink3); font-size: 11px; margin-left: 6px; }
.more { border: 0; background: none; padding: 0; color: var(--accent); }
.more:hover { text-decoration: underline; }
.acts { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0 2px; }
.sec { margin-top: 20px; }
.sec > h3 { font-size: 12px; font-weight: 600; color: var(--ink2); margin: 0 0 6px; display: flex; align-items: baseline; gap: 6px; }
.sec > h3 .n { color: var(--ink3); font-weight: 400; }
.sec > p.note { margin: 0 0 6px; color: var(--ink3); font-size: 12px; }
.lnk { border: 0; background: none; padding: 1px 0; color: var(--ink); text-align: left; display: inline; border-radius: 4px; text-decoration: underline; text-decoration-color: var(--line2); text-underline-offset: 3px; text-decoration-thickness: 1px; }
.lnk:hover { text-decoration-color: currentColor; }
.lnk .dot { margin-right: 6px; vertical-align: 1px; }
.lnk.p { color: var(--rel); text-decoration-color: var(--rel-bg); }
.lnk.dp { color: var(--restr); text-decoration-color: var(--restr-bg); }
.lnk.gone { color: var(--ink3); }
ul.list { list-style: none; margin: 0; padding: 0; }
ul.list li { padding: 3px 0; line-height: 1.5; }
ul.list li .tag { margin-left: 6px; vertical-align: 1px; }
.arrow { color: var(--ink3); margin: 0 5px; }
.kw { color: var(--restr); font-weight: 600; }
.expr { line-height: 1.65; }
.expr .mut { color: var(--ink3); }
dl.kv { margin: 0; display: grid; grid-template-columns: minmax(0, 132px) minmax(0, 1fr); gap: 5px 12px; }
dl.kv dt { color: var(--ink2); overflow: hidden; text-overflow: ellipsis; }
dl.kv dd { margin: 0; }
dl.kv dd a { color: var(--accent); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.stats div { background: var(--surface); padding: 9px 11px; }
.stats b { display: block; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.stats span { color: var(--ink2); font-size: 12px; }
.branches li { display: flex; align-items: center; gap: 8px; }
.branches .bar { flex: 1; height: 4px; border-radius: 2px; background: var(--surface2); overflow: hidden; min-width: 20px; }
.branches .bar i { display: block; height: 100%; border-radius: 2px; }
.branches .cnt { color: var(--ink3); font-variant-numeric: tabular-nums; font-size: 12px; min-width: 38px; text-align: right; }
.branches .lnk { flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 190px; }
details { margin-top: 6px; }
details > summary { cursor: pointer; color: var(--ink2); padding: 2px 0; }
details > summary:hover { color: var(--ink); }
details ul.list { margin: 2px 0 4px 14px; }
.callout { margin-top: 16px; background: var(--surface2); border-radius: 9px; padding: 9px 11px; color: var(--ink2); line-height: 1.5; }
#pfilter { width: 100%; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); padding: 0 10px; outline: none; margin-bottom: 4px; }
#pfilter:focus { border-color: var(--accent); }
.prow { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 6px 8px; margin: 0 -8px; border-radius: 7px; width: calc(100% + 16px); }
.prow:hover { background: var(--surface2); }
.prow .nm { display: flex; align-items: center; gap: 8px; }
.prow .dr { color: var(--ink3); font-size: 12px; padding-left: 18px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#panelToggle { position: absolute; right: 12px; top: 12px; box-shadow: var(--shadow-s); z-index: 4; }
#app:not(.nopanel) #panelToggle { display: none; }

/* overlays */
#drop { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: var(--veil); pointer-events: none; }
#drop div { border: 2px dashed var(--accent); border-radius: 18px; padding: 34px 48px; background: var(--surface); font-size: 17px; font-weight: 600; box-shadow: var(--shadow); text-align: center; }
#drop span { display: block; font-size: 13px; font-weight: 400; color: var(--ink2); margin-top: 4px; }
#modal { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; background: var(--veil); padding: 20px; }
.dlg { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); width: min(640px, 100%); max-height: min(86vh, 760px); display: flex; flex-direction: column; }
.dlg header { display: flex; align-items: center; padding: 14px 14px 10px 20px; gap: 10px; }
.dlg header h2 { margin: 0; font-size: 17px; font-weight: 600; flex: 1; letter-spacing: -0.01em; }
.dlg .body { padding: 0 20px 6px; overflow: auto; min-height: 0; }
.dlg .body p { margin: 0 0 10px; color: var(--ink2); line-height: 1.55; }
.dlg footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px 16px; }
.dlg textarea { width: 100%; height: min(46vh, 380px); resize: vertical; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); padding: 10px 12px; font: 12px/1.5 var(--mono); outline: none; white-space: pre; }
.dlg textarea:focus { border-color: var(--accent); }
.dlg img { max-width: 100%; border: 1px solid var(--line); border-radius: 8px; display: block; }
.errbox { font: 12px/1.5 var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; overflow: auto; white-space: pre; margin: 0 0 12px; color: var(--ink); }
.errbox .car { color: var(--rel); font-weight: 700; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 7px 16px; align-items: center; margin: 0 0 16px; }
.keys dt { white-space: nowrap; }
.keys dd { margin: 0; color: var(--ink2); }
.dlg h3 { font-size: 13px; font-weight: 600; margin: 14px 0 8px; }
.legend { display: grid; grid-template-columns: 64px 1fr; gap: 8px 14px; align-items: center; margin: 0 0 14px; color: var(--ink2); }
.legend svg { width: 64px; height: 18px; display: block; }
#busy { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; background: var(--veil); }
#busy div { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 22px; box-shadow: var(--shadow); min-width: 260px; }
#busy b { display: block; font-weight: 600; margin-bottom: 10px; }
#busy i { display: block; height: 4px; border-radius: 2px; background: var(--surface2); overflow: hidden; position: relative; }
#busy i::after { content: ""; position: absolute; inset: 0; width: 40%; background: var(--accent); border-radius: 2px; animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
#toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 90; background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 10px; box-shadow: var(--shadow); max-width: min(560px, 92vw); text-align: center; }

@media (max-width: 860px) {
  #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; }
  #bar { flex-wrap: wrap; height: auto; padding: 8px 10px; row-gap: 8px; }
  .brand span { display: none; }
  #searchWrap { order: 10; flex-basis: 100%; max-width: none; }
  #panel { width: auto; border-left: 0; border-top: 1px solid var(--line); height: 42vh; }
  .pop { top: 48px; }
  #mini { display: none; }
  #hint { display: none; }
  .btn .lbl { display: none; }
}
@media (prefers-reduced-motion: reduce) { #busy i::after { animation: none; width: 100%; } }

</style>
</head>
<body>
<div id="app">
  <header id="bar">
    <div class="brand" title="Canopy ontology viewer">
      <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11h5M8 11V5.5a1.5 1.5 0 0 1 1.5-1.5H13M8 11v5.5A1.5 1.5 0 0 0 9.5 18H13M8 11h5"/><circle cx="16" cy="4" r="2" fill="currentColor" stroke="none"/><circle cx="16" cy="11" r="2" fill="currentColor" stroke="none"/><circle cx="16" cy="18" r="2" fill="currentColor" stroke="none"/></svg>
      <span>Canopy</span>
    </div>
    <button class="btn" id="fileBtn" aria-haspopup="true" aria-expanded="false" title="Open another ontology"><span class="fname">No file</span><span class="fmeta"></span></button>
    <div id="searchWrap">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
      <input id="search" type="text" placeholder="Search classes and properties" autocomplete="off" spellcheck="false" aria-label="Search classes and properties">
      <kbd aria-hidden="true">/</kbd>
      <div id="results" hidden></div>
    </div>
    <div class="spacer"></div>
    <div class="seg" id="viewSeg" role="group" aria-label="View">
      <button data-v="tree" aria-pressed="true" title="The whole hierarchy as a collapsible tree (G)">Tree</button>
      <button data-v="focus" aria-pressed="false" title="The neighbourhood of the selected class (G)">Focus</button>
    </div>
    <button class="btn" id="optBtn" aria-haspopup="true" aria-expanded="false"><span class="lbl">View options</span></button>
    <button class="btn" id="expBtn" aria-haspopup="true" aria-expanded="false"><span class="lbl">Export</span></button>
    <button class="btn icon" id="themeBtn" aria-label="Switch between light and dark" title="Switch between light and dark (T)"></button>
    <button class="btn icon" id="helpBtn" aria-label="Help and keyboard shortcuts" title="Help and keyboard shortcuts (?)"></button>
  </header>
  <main id="stage">
    <canvas id="cv" tabindex="0" aria-label="Ontology canvas. Use the search field and the details panel to read its content."></canvas>
    <div id="focusBar" hidden></div>
    <div id="hint" hidden></div>
    <div id="empty" hidden></div>
    <button class="btn line icon" id="panelToggle" aria-label="Show the details panel" title="Show the details panel (P)"></button>
    <div id="ctl"></div>
    <canvas id="mini" hidden></canvas>
    <div id="tip" hidden></div>
  </main>
  <aside id="panel" aria-label="Details">
    <div id="tabs" role="tablist">
      <button role="tab" data-tab="details" aria-selected="true">Details</button>
      <button role="tab" data-tab="props" aria-selected="false">Properties<span class="n"></span></button>
      <button class="mini-btn" id="panelHide" style="margin-left:auto;align-self:center" aria-label="Hide the details panel" title="Hide the details panel (P)"></button>
    </div>
    <div id="pbody"></div>
  </aside>
</div>
<div id="drop" hidden><div>Drop to open<span>RDF/XML, Turtle or N-Triples. Several files are merged into one view.</span></div></div>
<div id="modal" hidden></div>
<div id="busy" hidden><div><b></b><i></i></div></div>
<div id="toast" hidden role="status"></div>
<input type="file" id="file" hidden multiple>
<script type="text/plain" id="sample-ttl">
@prefix : <https://example.org/orchestra#> .
@prefix owl: <http://www.w3.org/2002/07/owl#> .
@prefix rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#> .
@prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> .
@prefix xsd: <http://www.w3.org/2001/XMLSchema#> .
@prefix skos: <http://www.w3.org/2004/02/skos/core#> .
@prefix dcterms: <http://purl.org/dc/terms/> .

<https://example.org/orchestra> a owl:Ontology ;
    dcterms:title "Orchestra, a sample ontology"@en ;
    dcterms:description "A small ontology about instruments, musicians, ensembles and performances. It ships with Canopy so there is something to explore before you open your own file."@en ;
    owl:versionInfo "1.0" .

### Instruments

:Instrument a owl:Class ; rdfs:label "Instrument"@en, "Instrument"@de ;
    rdfs:comment "A device made or adapted to produce musical sound."@en .

:StringInstrument a owl:Class ; rdfs:subClassOf :Instrument ; rdfs:label "String instrument"@en, "Saiteninstrument"@de ;
    rdfs:comment "An instrument whose sound comes from vibrating strings."@en .
:BowedString a owl:Class ; rdfs:subClassOf :StringInstrument ; rdfs:label "Bowed string"@en, "Streichinstrument"@de .
:PluckedString a owl:Class ; rdfs:subClassOf :StringInstrument ; rdfs:label "Plucked string"@en, "Zupfinstrument"@de .
:StruckString a owl:Class ; rdfs:subClassOf :StringInstrument ; rdfs:label "Struck string"@en, "Schlagsaiteninstrument"@de .
:Violin a owl:Class ; rdfs:subClassOf :BowedString ; rdfs:label "Violin"@en, "Violine"@de ; skos:altLabel "Fiddle"@en, "Geige"@de .
:Viola a owl:Class ; rdfs:subClassOf :BowedString ; rdfs:label "Viola"@en, "Bratsche"@de .
:Cello a owl:Class ; rdfs:subClassOf :BowedString ; rdfs:label "Cello"@en, "Violoncello"@de .
:DoubleBass a owl:Class ; rdfs:subClassOf :BowedString ; rdfs:label "Double bass"@en, "Kontrabass"@de .
:Harp a owl:Class ; rdfs:subClassOf :PluckedString ; rdfs:label "Harp"@en, "Harfe"@de .
:Guitar a owl:Class ; rdfs:subClassOf :PluckedString ; rdfs:label "Guitar"@en, "Gitarre"@de .
:Lute a owl:Class ; rdfs:subClassOf :PluckedString ; rdfs:label "Lute"@en, "Laute"@de .
:Dulcimer a owl:Class ; rdfs:subClassOf :StruckString ; rdfs:label "Hammered dulcimer"@en, "Hackbrett"@de .

:KeyboardInstrument a owl:Class ; rdfs:subClassOf :Instrument ; rdfs:label "Keyboard instrument"@en, "Tasteninstrument"@de ;
    rdfs:comment "An instrument played through a row of keys. Keyboards cut across the other families, so several of these classes have a second parent."@en .
:Piano a owl:Class ; rdfs:subClassOf :KeyboardInstrument, :StruckString ; rdfs:label "Piano"@en, "Klavier"@de ;
    rdfs:comment "A keyboard instrument whose strings are struck by felt hammers."@en ; skos:altLabel "Pianoforte"@en .
:Harpsichord a owl:Class ; rdfs:subClassOf :KeyboardInstrument, :PluckedString ; rdfs:label "Harpsichord"@en, "Cembalo"@de .
:Organ a owl:Class ; rdfs:subClassOf :KeyboardInstrument, :WindInstrument ; rdfs:label "Pipe organ"@en, "Orgel"@de .
:Celesta a owl:Class ; rdfs:subClassOf :KeyboardInstrument, :PitchedPercussion ; rdfs:label "Celesta"@en, "Celesta"@de .
:Fortepiano a owl:Class ; rdfs:subClassOf :KeyboardInstrument ; rdfs:label "Fortepiano"@en ; owl:deprecated true ;
    rdfs:comment "Deprecated. Use Piano instead."@en .

:WindInstrument a owl:Class ; rdfs:subClassOf :Instrument ; rdfs:label "Wind instrument"@en, "Blasinstrument"@de .
:Woodwind a owl:Class ; rdfs:subClassOf :WindInstrument ; rdfs:label "Woodwind"@en, "Holzblasinstrument"@de ; owl:disjointWith :Brass .
:Brass a owl:Class ; rdfs:subClassOf :WindInstrument ; rdfs:label "Brass"@en, "Blechblasinstrument"@de .
:Flute a owl:Class ; rdfs:subClassOf :Woodwind ; rdfs:label "Flute"@en, "Querfl\u00F6te"@de .
:Piccolo a owl:Class ; rdfs:subClassOf :Flute ; rdfs:label "Piccolo"@en, "Piccolofl\u00F6te"@de .
:Oboe a owl:Class ; rdfs:subClassOf :Woodwind ; rdfs:label "Oboe"@en, "Oboe"@de .
:CorAnglais a owl:Class ; rdfs:subClassOf :Oboe ; rdfs:label "Cor anglais"@en, "Englischhorn"@de ; skos:altLabel "English horn"@en .
:Clarinet a owl:Class ; rdfs:subClassOf :Woodwind ; rdfs:label "Clarinet"@en, "Klarinette"@de .
:BassClarinet a owl:Class ; rdfs:subClassOf :Clarinet ; rdfs:label "Bass clarinet"@en, "Bassklarinette"@de .
:Bassoon a owl:Class ; rdfs:subClassOf :Woodwind ; rdfs:label "Bassoon"@en, "Fagott"@de .
:Contrabassoon a owl:Class ; rdfs:subClassOf :Bassoon ; rdfs:label "Contrabassoon"@en, "Kontrafagott"@de .
:Saxophone a owl:Class ; rdfs:subClassOf :Woodwind ; rdfs:label "Saxophone"@en, "Saxophon"@de .
:Trumpet a owl:Class ; rdfs:subClassOf :Brass ; rdfs:label "Trumpet"@en, "Trompete"@de .
:FrenchHorn a owl:Class ; rdfs:subClassOf :Brass ; rdfs:label "French horn"@en, "Waldhorn"@de .
:Trombone a owl:Class ; rdfs:subClassOf :Brass ; rdfs:label "Trombone"@en, "Posaune"@de .
:BassTrombone a owl:Class ; rdfs:subClassOf :Trombone ; rdfs:label "Bass trombone"@en, "Bassposaune"@de .
:Tuba a owl:Class ; rdfs:subClassOf :Brass ; rdfs:label "Tuba"@en, "Tuba"@de .

:PercussionInstrument a owl:Class ; rdfs:subClassOf :Instrument ; rdfs:label "Percussion instrument"@en, "Schlaginstrument"@de .
:PitchedPercussion a owl:Class ; rdfs:subClassOf :PercussionInstrument ; rdfs:label "Pitched percussion"@en, "Stabspiel und Pauke"@de .
:UnpitchedPercussion a owl:Class ; rdfs:subClassOf :PercussionInstrument ; rdfs:label "Unpitched percussion"@en, "Schlagwerk ohne Tonh\u00F6he"@de .
:Timpani a owl:Class ; rdfs:subClassOf :PitchedPercussion ; rdfs:label "Timpani"@en, "Pauke"@de ; skos:altLabel "Kettledrums"@en .
:Xylophone a owl:Class ; rdfs:subClassOf :PitchedPercussion ; rdfs:label "Xylophone"@en, "Xylophon"@de .
:Marimba a owl:Class ; rdfs:subClassOf :PitchedPercussion ; rdfs:label "Marimba"@en, "Marimba"@de .
:Glockenspiel a owl:Class ; rdfs:subClassOf :PitchedPercussion ; rdfs:label "Glockenspiel"@en, "Glockenspiel"@de .
:SnareDrum a owl:Class ; rdfs:subClassOf :UnpitchedPercussion ; rdfs:label "Snare drum"@en, "Kleine Trommel"@de .
:BassDrum a owl:Class ; rdfs:subClassOf :UnpitchedPercussion ; rdfs:label "Bass drum"@en, "Gro\u00DFe Trommel"@de .
:Cymbals a owl:Class ; rdfs:subClassOf :UnpitchedPercussion ; rdfs:label "Cymbals"@en, "Becken"@de .
:Triangle a owl:Class ; rdfs:subClassOf :UnpitchedPercussion ; rdfs:label "Triangle"@en, "Triangel"@de .
:Tambourine a owl:Class ; rdfs:subClassOf :UnpitchedPercussion ; rdfs:label "Tambourine"@en, "Tamburin"@de .

[] a owl:AllDisjointClasses ; owl:members ( :BowedString :Woodwind :Brass :UnpitchedPercussion ) .

### People and groups

:Agent a owl:Class ; rdfs:label "Agent"@en, "Akteur"@de ; rdfs:comment "A person or an organised group that can act."@en .
:Person a owl:Class ; rdfs:subClassOf :Agent ; rdfs:label "Person"@en, "Person"@de ; owl:disjointWith :Organization .
:Organization a owl:Class ; rdfs:subClassOf :Agent ; rdfs:label "Organization"@en, "Organisation"@de .

:Musician a owl:Class ; rdfs:subClassOf :Person ; rdfs:label "Musician"@en, "Musiker"@de .
:Instrumentalist a owl:Class ; rdfs:subClassOf :Musician ; rdfs:label "Instrumentalist"@en, "Instrumentalist"@de ;
    rdfs:subClassOf [ a owl:Restriction ; owl:onProperty :plays ; owl:someValuesFrom :Instrument ] .
:Violinist a owl:Class ; rdfs:subClassOf :Instrumentalist ; rdfs:label "Violinist"@en, "Geiger"@de ;
    rdfs:subClassOf [ a owl:Restriction ; owl:onProperty :plays ; owl:someValuesFrom :Violin ] .
:Cellist a owl:Class ; rdfs:subClassOf :Instrumentalist ; rdfs:label "Cellist"@en, "Cellist"@de ;
    rdfs:subClassOf [ a owl:Restriction ; owl:onProperty :plays ; owl:someValuesFrom :Cello ] .
:Pianist a owl:Class ; rdfs:subClassOf :Instrumentalist ; rdfs:label "Pianist"@en, "Pianist"@de ;
    rdfs:subClassOf [ a owl:Restriction ; owl:onProperty :plays ; owl:someValuesFrom :Piano ] .
:Percussionist a owl:Class ; rdfs:subClassOf :Instrumentalist ; rdfs:label "Percussionist"@en, "Schlagzeuger"@de ;
    rdfs:subClassOf [ a owl:Restriction ; owl:onProperty :plays ; owl:someValuesFrom :PercussionInstrument ] .
:Singer a owl:Class ; rdfs:subClassOf :Musician ; rdfs:label "Singer"@en, "S\u00E4nger"@de .
:Soprano a owl:Class ; rdfs:subClassOf :Singer ; rdfs:label "Soprano"@en, "Sopran"@de .
:Alto a owl:Class ; rdfs:subClassOf :Singer ; rdfs:label "Alto"@en, "Alt"@de .
:Tenor a owl:Class ; rdfs:subClassOf :Singer ; rdfs:label "Tenor"@en, "Tenor"@de .
:Baritone a owl:Class ; rdfs:subClassOf :Singer ; rdfs:label "Baritone"@en, "Bariton"@de .
:Conductor a owl:Class ; rdfs:subClassOf :Musician ; rdfs:label "Conductor"@en, "Dirigent"@de ;
    rdfs:subClassOf [ a owl:Restriction ; owl:onProperty :conducts ; owl:someValuesFrom :Ensemble ] .
:Composer a owl:Class ; rdfs:subClassOf :Person ; rdfs:label "Composer"@en, "Komponist"@de .

:Concertmaster a owl:Class ; rdfs:label "Concertmaster"@en, "Konzertmeister"@de ;
    rdfs:comment "The leading first violinist. Defined by an equivalence, so the viewer places it under Violinist."@en ;
    owl:equivalentClass [ a owl:Class ; owl:intersectionOf ( :Violinist [ a owl:Restriction ; owl:onProperty :leads ; owl:someValuesFrom :StringSection ] ) ] .
:Soloist a owl:Class ; rdfs:label "Soloist"@en, "Solist"@de ;
    owl:equivalentClass [ a owl:Class ; owl:intersectionOf ( :Musician [ a owl:Restriction ; owl:onProperty :soloistIn ; owl:someValuesFrom :Concert ] ) ] .

:Ensemble a owl:Class ; rdfs:subClassOf :Organization ; rdfs:label "Ensemble"@en, "Ensemble"@de ;
    rdfs:subClassOf [ a owl:Restriction ; owl:onProperty :hasMember ; owl:allValuesFrom :Musician ] .
:Orchestra a owl:Class ; rdfs:subClassOf :Ensemble ; rdfs:label "Orchestra"@en, "Orchester"@de .
:SymphonyOrchestra a owl:Class ; rdfs:subClassOf :Orchestra ; rdfs:label "Symphony orchestra"@en, "Sinfonieorchester"@de ;
    rdfs:subClassOf [ a owl:Restriction ; owl:onProperty :hasSection ; owl:someValuesFrom :StringSection ] ,
                    [ a owl:Restriction ; owl:onProperty :hasSection ; owl:someValuesFrom :WoodwindSection ] ,
                    [ a owl:Restriction ; owl:onProperty :hasSection ; owl:someValuesFrom :BrassSection ] ,
                    [ a owl:Restriction ; owl:onProperty :hasSection ; owl:someValuesFrom :PercussionSection ] .
:ChamberOrchestra a owl:Class ; rdfs:subClassOf :Orchestra ; rdfs:label "Chamber orchestra"@en, "Kammerorchester"@de .
:ChamberEnsemble a owl:Class ; rdfs:subClassOf :Ensemble ; rdfs:label "Chamber ensemble"@en, "Kammerensemble"@de .
:StringQuartet a owl:Class ; rdfs:subClassOf :ChamberEnsemble ; rdfs:label "String quartet"@en, "Streichquartett"@de ;
    rdfs:subClassOf [ a owl:Restriction ; owl:onProperty :hasMember ; owl:qualifiedCardinality "2"^^xsd:nonNegativeInteger ; owl:onClass :Violinist ] ,
                    [ a owl:Restriction ; owl:onProperty :hasMember ; owl:qualifiedCardinality "1"^^xsd:nonNegativeInteger ; owl:onClass :Cellist ] ,
                    [ a owl:Restriction ; owl:onProperty :hasMember ; owl:cardinality "4"^^xsd:nonNegativeInteger ] .
:PianoTrio a owl:Class ; rdfs:subClassOf :ChamberEnsemble ; rdfs:label "Piano trio"@en, "Klaviertrio"@de ;
    rdfs:subClassOf [ a owl:Restriction ; owl:onProperty :hasMember ; owl:someValuesFrom :Pianist ] ,
                    [ a owl:Restriction ; owl:onProperty :hasMember ; owl:cardinality "3"^^xsd:nonNegativeInteger ] .
:WindQuintet a owl:Class ; rdfs:subClassOf :ChamberEnsemble ; rdfs:label "Wind quintet"@en, "Bl\u00E4serquintett"@de .
:Choir a owl:Class ; rdfs:subClassOf :Ensemble ; rdfs:label "Choir"@en, "Chor"@de ;
    rdfs:subClassOf [ a owl:Restriction ; owl:onProperty :hasMember ; owl:allValuesFrom :Singer ] .
:Section a owl:Class ; rdfs:subClassOf :Organization ; rdfs:label "Section"@en, "Stimmgruppe"@de ;
    rdfs:comment "A group of players of related instruments inside an orchestra."@en .
:StringSection a owl:Class ; rdfs:subClassOf :Section ; rdfs:label "String section"@en, "Streicher"@de ;
    rdfs:subClassOf [ a owl:Restriction ; owl:onProperty :hasMember ; owl:allValuesFrom
        [ a owl:Restriction ; owl:onProperty :plays ; owl:someValuesFrom :BowedString ] ] .
:WoodwindSection a owl:Class ; rdfs:subClassOf :Section ; rdfs:label "Woodwind section"@en, "Holzbl\u00E4ser"@de .
:BrassSection a owl:Class ; rdfs:subClassOf :Section ; rdfs:label "Brass section"@en, "Blechbl\u00E4ser"@de .
:PercussionSection a owl:Class ; rdfs:subClassOf :Section ; rdfs:label "Percussion section"@en, "Schlagwerk"@de .

### Works, events and places

:MusicalWork a owl:Class ; rdfs:label "Musical work"@en, "Musikwerk"@de ;
    rdfs:subClassOf [ a owl:Restriction ; owl:onProperty :composedBy ; owl:someValuesFrom :Composer ] .
:Symphony a owl:Class ; rdfs:subClassOf :MusicalWork ; rdfs:label "Symphony"@en, "Sinfonie"@de .
:Concerto a owl:Class ; rdfs:subClassOf :MusicalWork ; rdfs:label "Concerto"@en, "Konzert (Werk)"@de ;
    rdfs:subClassOf [ a owl:Restriction ; owl:onProperty :writtenFor ; owl:someValuesFrom :Instrument ] .
:PianoConcerto a owl:Class ; rdfs:subClassOf :Concerto ; rdfs:label "Piano concerto"@en, "Klavierkonzert"@de ;
    rdfs:subClassOf [ a owl:Restriction ; owl:onProperty :writtenFor ; owl:someValuesFrom :Piano ] .
:ViolinConcerto a owl:Class ; rdfs:subClassOf :Concerto ; rdfs:label "Violin concerto"@en, "Violinkonzert"@de ;
    rdfs:subClassOf [ a owl:Restriction ; owl:onProperty :writtenFor ; owl:someValuesFrom :Violin ] .
:Opera a owl:Class ; rdfs:subClassOf :MusicalWork ; rdfs:label "Opera"@en, "Oper"@de .
:Overture a owl:Class ; rdfs:subClassOf :MusicalWork ; rdfs:label "Overture"@en, "Ouvert\u00FCre"@de .
:ChamberWork a owl:Class ; rdfs:subClassOf :MusicalWork ; rdfs:label "Chamber work"@en, "Kammermusikwerk"@de .

:Event a owl:Class ; rdfs:label "Event"@en, "Ereignis"@de .
:Performance a owl:Class ; rdfs:subClassOf :Event ; rdfs:label "Performance"@en, "Auff\u00FChrung"@de .
:Concert a owl:Class ; rdfs:subClassOf :Performance ; rdfs:label "Concert"@en, "Konzert (Veranstaltung)"@de ;
    rdfs:subClassOf [ a owl:Restriction ; owl:onProperty :features ; owl:someValuesFrom :MusicalWork ] ,
                    [ a owl:Restriction ; owl:onProperty :takesPlaceAt ; owl:someValuesFrom :ConcertHall ] .
:OperaProduction a owl:Class ; rdfs:subClassOf :Performance ; rdfs:label "Opera production"@en, "Opernproduktion"@de ;
    rdfs:subClassOf [ a owl:Restriction ; owl:onProperty :features ; owl:someValuesFrom :Opera ] ,
                    [ a owl:Restriction ; owl:onProperty :takesPlaceAt ; owl:someValuesFrom :OperaHouse ] .
:Rehearsal a owl:Class ; rdfs:subClassOf :Event ; rdfs:label "Rehearsal"@en, "Probe"@de .

:Venue a owl:Class ; rdfs:label "Venue"@en, "Spielst\u00E4tte"@de .
:ConcertHall a owl:Class ; rdfs:subClassOf :Venue ; rdfs:label "Concert hall"@en, "Konzertsaal"@de .
:OperaHouse a owl:Class ; rdfs:subClassOf :Venue ; rdfs:label "Opera house"@en, "Opernhaus"@de .

### Object properties

:plays a owl:ObjectProperty ; rdfs:label "plays"@en, "spielt"@de ; rdfs:domain :Instrumentalist ; rdfs:range :Instrument ; owl:inverseOf :playedBy .
:playedBy a owl:ObjectProperty ; rdfs:label "played by"@en, "gespielt von"@de ; rdfs:domain :Instrument ; rdfs:range :Instrumentalist .
:memberOf a owl:ObjectProperty ; rdfs:label "member of"@en, "Mitglied von"@de ; rdfs:domain :Musician ;
    rdfs:range [ a owl:Class ; owl:unionOf ( :Ensemble :Section ) ] ; owl:inverseOf :hasMember .
:hasMember a owl:ObjectProperty ; rdfs:label "has member"@en, "hat Mitglied"@de ; rdfs:range :Musician .
:hasSection a owl:ObjectProperty ; rdfs:label "has section"@en, "hat Stimmgruppe"@de ; rdfs:domain :Orchestra ; rdfs:range :Section .
:leads a owl:ObjectProperty ; rdfs:subPropertyOf :memberOf ; rdfs:label "leads"@en, "f\u00FChrt"@de ; rdfs:domain :Musician ; rdfs:range :Section .
:conducts a owl:ObjectProperty ; rdfs:label "conducts"@en, "dirigiert"@de ; rdfs:domain :Conductor ; rdfs:range :Ensemble .
:composedBy a owl:ObjectProperty, owl:FunctionalProperty ; rdfs:label "composed by"@en, "komponiert von"@de ; rdfs:domain :MusicalWork ; rdfs:range :Composer .
:writtenFor a owl:ObjectProperty ; rdfs:label "written for"@en, "geschrieben f\u00FCr"@de ; rdfs:domain :MusicalWork ; rdfs:range :Instrument .
:features a owl:ObjectProperty ; rdfs:label "features"@en, "bringt zur Auff\u00FChrung"@de ; rdfs:domain :Performance ; rdfs:range :MusicalWork .
:performedBy a owl:ObjectProperty ; rdfs:label "performed by"@en, "aufgef\u00FChrt von"@de ; rdfs:domain :Performance ; rdfs:range :Ensemble .
:soloistIn a owl:ObjectProperty ; rdfs:label "soloist in"@en, "Solist in"@de ; rdfs:domain :Musician ; rdfs:range :Performance .
:takesPlaceAt a owl:ObjectProperty, owl:FunctionalProperty ; rdfs:label "takes place at"@en, "findet statt in"@de ; rdfs:domain :Event ; rdfs:range :Venue .
:residentAt a owl:ObjectProperty ; rdfs:label "resident at"@en, "beheimatet in"@de ; rdfs:domain :Orchestra ; rdfs:range :ConcertHall .

### Datatype properties

:name a owl:DatatypeProperty ; rdfs:label "name"@en, "Name"@de ; rdfs:domain :Agent ; rdfs:range xsd:string .
:opusNumber a owl:DatatypeProperty ; rdfs:label "opus number"@en, "Opuszahl"@de ; rdfs:domain :MusicalWork ; rdfs:range xsd:string .
:premiereDate a owl:DatatypeProperty ; rdfs:label "premiere date"@en, "Datum der Urauff\u00FChrung"@de ; rdfs:domain :MusicalWork ; rdfs:range xsd:date .
:startTime a owl:DatatypeProperty ; rdfs:label "start time"@en, "Beginn"@de ; rdfs:domain :Event ; rdfs:range xsd:dateTime .
:seats a owl:DatatypeProperty ; rdfs:label "seats"@en, "Sitzpl\u00E4tze"@de ; rdfs:domain :Venue ; rdfs:range xsd:positiveInteger .
:numberOfStrings a owl:DatatypeProperty ; rdfs:label "number of strings"@en, "Anzahl der Saiten"@de ; rdfs:domain :StringInstrument ; rdfs:range xsd:positiveInteger .

### A few individuals

:Beethoven a owl:NamedIndividual, :Composer ; rdfs:label "Ludwig van Beethoven" .
:ClaraSchumann a owl:NamedIndividual, :Composer, :Pianist ; rdfs:label "Clara Schumann" .
:Symphony5 a owl:NamedIndividual, :Symphony ; rdfs:label "Symphony No. 5 in C minor" ; :composedBy :Beethoven ; :opusNumber "67" .
:EmperorConcerto a owl:NamedIndividual, :PianoConcerto ; rdfs:label "Piano Concerto No. 5 (Emperor)" ; :composedBy :Beethoven ; :opusNumber "73" .
:Musikverein a owl:NamedIndividual, :ConcertHall ; rdfs:label "Musikverein, Vienna" ; :seats "1744"^^xsd:positiveInteger .
:Concertgebouw a owl:NamedIndividual, :ConcertHall ; rdfs:label "Concertgebouw, Amsterdam" ; :seats "1974"^^xsd:positiveInteger .

</script>
<script>
/* Canopy core: parsers (Turtle / N-Triples, RDF/XML) and the schema model.
   Pure functions, no DOM. Runs in the page, in a Web Worker and in Node. */
function CanopyCore() {
  'use strict';

  var RDF = 'http://www.w3.org/1999/02/22-rdf-syntax-ns#';
  var RDFS = 'http://www.w3.org/2000/01/rdf-schema#';
  var OWL = 'http://www.w3.org/2002/07/owl#';
  var XSD = 'http://www.w3.org/2001/XMLSchema#';
  var SKOS = 'http://www.w3.org/2004/02/skos/core#';
  var XMLNS = 'http://www.w3.org/XML/1998/namespace';
  var OBOINOWL = 'http://www.geneontology.org/formats/oboInOwl#';

  /* ---------- errors ---------- */

  function makeError(msg, text, pos) {
    if (pos > text.length) pos = text.length;
    var line = 1, last = -1, i = -1;
    while ((i = text.indexOf('\n', i + 1)) !== -1 && i < pos) { line++; last = i; }
    var col = pos - last;
    var end = text.indexOf('\n', pos); if (end < 0) end = text.length;
    var lineText = text.slice(last + 1, end).replace(/\r$/, '');
    var from = Math.max(0, col - 1 - 70);
    var e = new Error(msg);
    e.name = 'ParseError';
    e.line = line; e.col = col;
    e.excerpt = (from > 0 ? '\u2026' : '') + lineText.slice(from, from + 140) + (lineText.length > from + 140 ? '\u2026' : '');
    e.caret = col - 1 - from + (from > 0 ? 1 : 0);
    return e;
  }

  /* ---------- IRI resolution (RFC 3986, section 5) ---------- */

  var RE_ABS = /^[A-Za-z][A-Za-z0-9+.\-]*:/;
  var RE_IRI = /^(?:([^:\/?#]+):)?(?:\/\/([^\/?#]*))?([^?#]*)(?:\?([^#]*))?(?:#([\s\S]*))?$/;

  function removeDotSegments(p) {
    var out = '';
    while (p.length) {
      if (p.slice(0, 3) === '../') p = p.slice(3);
      else if (p.slice(0, 2) === './') p = p.slice(2);
      else if (p.slice(0, 3) === '/./') p = p.slice(2);
      else if (p === '/.') p = '/';
      else if (p.slice(0, 4) === '/../') { p = p.slice(3); out = out.slice(0, Math.max(0, out.lastIndexOf('/'))); }
      else if (p === '/..') { p = '/'; out = out.slice(0, Math.max(0, out.lastIndexOf('/'))); }
      else if (p === '.' || p === '..') p = '';
      else { var i = p.indexOf('/', 1); if (i < 0) { out += p; p = ''; } else { out += p.slice(0, i); p = p.slice(i); } }
    }
    return out;

      const url = URL.createObjectURL(blob), a = h('a', { href: url, download: name });
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      toast(note || 'Saved ' + name);
    }, 'image/png');
  } catch (e) { toast('The image could not be created: ' + e.message); }
}

/* ---------- files ---------- */

function pickFile() { const f = $('file'); f.value = ''; f.click(); }
function makeWorker() {
  const src = CanopyCore.toString() + '\nvar C = CanopyCore();\npostMessage({ready:true});\nonmessage = function (e) { try { var docs = e.data.docs.map(function (d) { return { name: d.name, text: d.text != null ? d.text : C.decodeBytes(d.buf) }; }); postMessage({ ok: true, model: C.load(docs) }); } catch (err) { postMessage({ ok: false, error: { message: err.message, name: err.name, line: err.line, col: err.col, excerpt: err.excerpt, caret: err.caret, file: err.file } }); } };';
  const url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
  const w = new Worker(url);
  w._url = url;
  return w;
}
function parseDocs(docs) {
  return new Promise((resolve, reject) => {
    const sync = () => setTimeout(() => {
      try { resolve(Core.load(docs.map((d) => ({ name: d.name, text: d.text != null ? d.text : Core.decodeBytes(d.buf) })))); } catch (e) { reject(e); }
    }, 40);
    let w = null, done = false, ready = false;
    try { w = makeWorker(); } catch (e) { w = null; }
    usedWorker = !!w;
    if (!w) { sync(); return; }
    const stop = () => { try { w.terminate(); URL.revokeObjectURL(w._url); } catch (e) { /* already gone */ } };
    const giveUp = () => { if (done) return; done = true; usedWorker = false; stop(); sync(); };
    const timer = setTimeout(() => { if (!ready) giveUp(); }, 2500);
    w.onmessage = (ev) => {
      if (done) return;
      if (ev.data.ready) { ready = true; clearTimeout(timer); return; }
      done = true; stop();
      if (ev.data.ok) resolve(ev.data.model);
      else { const e = new Error(ev.data.error.message); Object.assign(e, ev.data.error); reject(e); }
    };
    w.onerror = (ev) => { if (ev && ev.preventDefault) ev.preventDefault(); clearTimeout(timer); giveUp(); };
    try { w.postMessage({ docs: docs }); } catch (e) { giveUp(); }
  });
}
function readBuf(f) {
  if (f.arrayBuffer) return f.arrayBuffer();
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsArrayBuffer(f); });
}
let loading = false, usedWorker = null;
function openFiles(list) {
  const files = Array.from(list || []);
  if (!files.length || loading) return;
  loading = true;
  const label = files.length === 1 ? files[0].name : files[0].name + ' + ' + (files.length - 1) + ' more';
  busy('Reading ' + label);
  const t0 = performance.now();
  let bytes = 0;
  Promise.all(files.map(readBuf)).then((bufs) => {
    bufs.forEach((b) => { bytes += b.byteLength; });
    return parseDocs(files.map((f, j) => ({ name: f.name, buf: bufs[j] })));
  }).then((model) => {
    loadInfo = { ms: performance.now() - t0, bytes: bytes };
    setModel(model, label, false);
  }).catch(showError).then(() => { loading = false; busy(null); });
}
function loadText(text, label) {
  if (loading) return;
  loading = true;
  busy('Reading ' + label.toLowerCase());
  const t0 = performance.now();
  parseDocs([{ name: label, text: text }]).then((model) => {
    loadInfo = { ms: performance.now() - t0, bytes: text.length };
    setModel(model, label, false);
  }).catch((e) => { if (e) e.file = null; showError(e); }).then(() => { loading = false; busy(null); });
}
function loadSample() {
  try {
    const m = Core.load([{ name: 'orchestra.ttl', text: $('sample-ttl').textContent }]);
    loadInfo = null;
    setModel(m, 'Orchestra (sample)', true);
  } catch (e) { showError(e); }
}

/* ---------- tooltip ---------- */

let tipTimer = 0;
function hideTip() { clearTimeout(tipTimer); $('tip').hidden = true; }
function scheduleTip(sx, sy) {
  hideTip();
  const hv = S.hover;
  if (!hv) return;
  tipTimer = setTimeout(() => {
    const t = $('tip');
    t.textContent = '';
    if (hv.level) { t.appendChild(h('b', { text: 'Level ' + hv.level })); t.appendChild(h('span', { text: 'Click to show the tree down to this level' })); }
    else {
      const n = hv.n, f = hv.f;
      if (f && f.k === 'i') {
        const ind = M.inds[f.i];
        t.appendChild(h('b', { text: indName(ind) }));
        t.appendChild(h('span', { text: ind.types.length ? 'Individual of ' + ind.types.slice(0, 4).map((x) => cname[x]).join(', ') : 'Individual without a class' }));
        t.appendChild(h('span', { text: plural(ind.out.length / 2 + indIn[f.i].length / 2, 'statement', 'statements') + (ind.dv.length ? ', ' + plural(ind.dv.length / 4, 'data value', 'data values') : '') }));
      } else if (f && f.stub) { t.appendChild(h('b', { text: f.t })); t.appendChild(h('span', { text: 'Click to show more neighbours' })); }
      else {
        const i = n ? n.i : f.i;
        if (i === -3) { t.appendChild(h('b', { text: plural(extGroup.kids.length, nouns()[0], nouns()[1]) + ' declared elsewhere' })); t.appendChild(h('span', { text: 'This file mentions them, for example in restrictions, but does not declare them. They usually come from an imported ontology.' })); }
        else if (i < 0) { t.appendChild(h('b', { text: root.name })); t.appendChild(h('span', { text: 'The root: every ' + nouns()[0] + ' is below it' })); }
        else {
          const c = M.classes[i], nd = nodes[i];
          t.appendChild(h('b', { text: cname[i] }));
          const bits = [];
          if (nd && nd.kids.length) bits.push(plural(nd.kids.length, 'direct sub' + nouns()[0], 'direct sub' + nouns()[1]) + (nd.desc > nd.kids.length ? ', ' + nf.format(nd.desc) + ' in the branch' : ''));
          if (par[i] && par[i].length > 1) bits.push(par[i].length + ' parents');
          if (c.ind.length) bits.push(plural(c.ind.length, 'individual', 'individuals'));
          if (bits.length) t.appendChild(h('span', { text: bits.join('; ') }));
          if (c.comments.length) { const cm = c.comments.slice().sort((a, b) => langRank(b[1]) - langRank(a[1]))[0][0]; t.appendChild(h('span', { style: 'margin-top:3px', text: trunc(cm.replace(/\s+/g, ' '), 150) })); }
        }
      }
    }
    t.hidden = false;
    const tw = t.offsetWidth, th = t.offsetHeight;
    t.style.left = Math.max(6, Math.min(W - tw - 6, sx + 14)) + 'px';
    t.style.top = (sy + 20 + th > H - 6 ? Math.max(6, sy - th - 12) : sy + 20) + 'px';
  }, 520);
}

/* ---------- pointer, wheel, keyboard ---------- */

const ptrs = new Map();
let down = null, pinch = null, dragF = null;
function local(ev) { const r = cv.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; }
function setHover(hv, sx, sy) {
  const a = S.hover, same = (!a && !hv) || (a && hv && a.n === hv.n && a.level === hv.level && a.f === hv.f);
  if (same) return;
  S.hover = hv;
  cv.style.cursor = hv ? 'pointer' : '';
  arcKey = '';
  if (hv) scheduleTip(sx, sy); else hideTip();
  draw();
}
cv.addEventListener('pointerdown', (ev) => {
  if (ev.button > 1) return;
  cv.focus({ preventScroll: true });
  closePop(); $('results').hidden = true; hideTip();
  try { cv.setPointerCapture(ev.pointerId); } catch (e) { /* not capturable */ }
  const p = local(ev);
  ptrs.set(ev.pointerId, p);
  if (ptrs.size === 2) {
    const a = Array.from(ptrs.values()), c = activeCam();
    pinch = { d: Math.hypot(a[0][0] - a[1][0], a[0][1] - a[1][1]) || 1, cx: (a[0][0] + a[1][0]) / 2, cy: (a[0][1] + a[1][1]) / 2, k: c.k, x: c.x, y: c.y };
    down = null; return;
  }
  const c = activeCam();
  down = { x: p[0], y: p[1], cx: c.x, cy: c.y, moved: false, id: ev.pointerId };
  dragF = null;
  if (S.view === 'focus') { const o = hitFocus(p[0], p[1]); if (o) dragF = { o: o, x: o.x, y: o.y }; }
});
cv.addEventListener('pointermove', (ev) => {
  const p = local(ev);
  if (ptrs.has(ev.pointerId)) ptrs.set(ev.pointerId, p);
  if (pinch && ptrs.size === 2) {
    const a = Array.from(ptrs.values()), c = activeCam();
    const d = Math.hypot(a[0][0] - a[1][0], a[0][1] - a[1][1]) || 1, cx = (a[0][0] + a[1][0]) / 2, cy = (a[0][1] + a[1][1]) / 2;
    const k1 = Math.max(MINK, Math.min(MAXK, pinch.k * d / pinch.d));
    c.x = cx - (pinch.cx - pinch.x) * k1 / pinch.k; c.y = cy - (pinch.cy - pinch.y) * k1 / pinch.k; c.k = k1;
    anim = null; draw(); return;
  }
  if (down && ptrs.has(down.id)) {
    const dx = p[0] - down.x, dy = p[1] - down.y;
    if (!down.moved && Math.hypot(dx, dy) > 4) { down.moved = true; hideTip(); if (anim) { anim = null; settle(); } cv.style.cursor = 'grabbing'; }
    if (down.moved) {
      if (dragF) { const o = dragF.o; o.x = o.nx = dragF.x + dx / fcam.k; o.y = o.ny = dragF.y + dy / fcam.k; }
      else { const c = activeCam(); c.x = down.cx + dx; c.y = down.cy + dy; }
      draw();
    }
    return;
  }
  if (ev.pointerType === 'touch') return;
  if (S.view === 'tree') { const ht = hitTree(p[0], p[1]); setHover(ht ? (ht.level ? { level: ht.level } : { n: ht.n }) : null, p[0], p[1]); }
  else { const o = hitFocus(p[0], p[1]); setHover(o ? { f: o } : null, p[0], p[1]); }
});
function endPointer(ev) {
  const p = ptrs.get(ev.pointerId);
  ptrs.delete(ev.pointerId);
  if (pinch) { if (ptrs.size < 2) pinch = null; down = null; return; }
  if (!down || down.id !== ev.pointerId) return;
  const d = down;
  down = null; cv.style.cursor = S.hover ? 'pointer' : '';
  if (d.moved || ev.type === 'pointercancel' || !p) { dragF = null; return; }
  dragF = null;
  click(d.x, d.y, ev);
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('pointerleave', () => { if (!down) setHover(null); });

function click(sx, sy, ev) {
  if (!M) return;
  if (S.view === 'tree') {
    const ht = hitTree(sx, sy);
    if (!ht) { clearSel(); return; }
    if (ht.level) { setLevel(ht.level); return; }
    const n = ht.n;
    if ((ht.part === 'dot' || ht.part === 'chip') && n.kids.length) { toggle(n, ev.altKey); return; }
    if (n.i < 0) { if (n !== root && n.kids.length) toggle(n); else clearSel(); return; }
    selectClass(n.i, { reveal: false });
  } else {
    const o = hitFocus(sx, sy);
    if (!o) return;
    if (o.stub) { moreFocus(); return; }
    if (o.k === 'i') { if (!(F.kind === 'i' && o.i === F.center)) selectInd(o.i); }
    else if (!(F.kind === 'c' && o.i === F.center)) selectClass(o.i, {});
  }
}
cv.addEventListener('dblclick', (ev) => {
  if (S.view !== 'tree' || !M) return;
  const p = local(ev), ht = hitTree(p[0], p[1]);
  if (ht && ht.n && ht.n.i >= 0 && ht.part === 'label' && ht.n.kids.length) toggle(ht.n, ev.altKey);
});
cv.addEventListener('wheel', (ev) => {
  ev.preventDefault();
  if (!M) return;
  const p = local(ev), unit = ev.deltaMode === 1 ? 18 : ev.deltaMode === 2 ? H : 1;
  let dx = ev.deltaX * unit, dy = ev.deltaY * unit;
  if (ev.ctrlKey || ev.metaKey) { zoomAt(p[0], p[1], Math.exp(-Math.max(-60, Math.min(60, dy)) * (ev.deltaMode === 0 && Math.abs(ev.deltaY) < 40 ? 0.012 : 0.0035))); return; }
  if (ev.shiftKey && !dx) { dx = dy; dy = 0; }
  const c = activeCam();
  if (anim) { anim = null; settle(); }
  c.x -= dx; c.y -= dy;
  hideTip();
  draw();
}, { passive: false });

mini.addEventListener('pointerdown', (ev) => { try { mini.setPointerCapture(ev.pointerId); } catch (e) { /* ignore */ } mini._drag = true; miniTo(ev); });
mini.addEventListener('pointermove', (ev) => { if (mini._drag) miniTo(ev); });
mini.addEventListener('pointerup', () => { mini._drag = false; });
mini.addEventListener('pointercancel', () => { mini._drag = false; });

function navKey(key) {
  let n = selNode();
  if (!n || !isVisible(n)) { n = n ? visOf(n) : root.kids[0]; if (n && n.i >= 0) selectClass(n.i, {}); return; }
  let t = null;
  if (key === 'ArrowRight') { if (n.kids.length && !n.open) { toggle(n); return; } t = n.kids[0]; }
  else if (key === 'ArrowLeft') { if (n.kids.length && n.open) { toggle(n); return; } t = n.parent; }
  else { const cl = cols[n.depth], ix = cl.indexOf(n); t = cl[ix + (key === 'ArrowDown' ? 1 : -1)]; }
  if (t && t.i >= 0) selectClass(t.i, {});
}
window.addEventListener('keydown', (ev) => {
  const tg = ev.target, typing = tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA' || tg.tagName === 'SELECT' || tg.isContentEditable);
  if ((ev.ctrlKey || ev.metaKey) && (ev.key === 'o' || ev.key === 'O')) { ev.preventDefault(); pickFile(); return; }
  if (ev.key === 'Escape') {
    if (modalClose) { modalClose(); return; }
    if (pop) { closePop(); return; }
    if (tg === $('search')) { if (!$('results').hidden && $('search').value) { $('results').hidden = true; } else { $('search').value = ''; runSearch(''); $('search').blur(); } return; }
    if (typing) { tg.blur(); return; }
    if (S.query) { $('search').value = ''; runSearch(''); return; }
    clearSel(); return;
  }
  if (typing || modalClose || ev.ctrlKey || ev.metaKey || ev.altKey || !M) return;
  const k = ev.key;
  if (k === '/') { ev.preventDefault(); $('search').focus(); $('search').select(); return; }
  if (k === '?') { helpDialog(); return; }
  if (k === 'f' || k === 'F') { fitView(); return; }
  if (k === 'g' || k === 'G') { setView(S.view === 'tree' ? 'focus' : 'tree'); renderPanel(); return; }
  if (k === 't' || k === 'T') { applyTheme(S.theme === 'dark' ? 'light' : 'dark'); return; }
  if (k === 'p' || k === 'P') { togglePanel(); return; }
  if (k === '+' || k === '=') { zoomBy(1.3); return; }
  if (k === '-' || k === '_') { zoomBy(1 / 1.3); return; }
  if (S.view !== 'tree') return;
  if (tg && tg.tagName === 'BUTTON' && (k === ' ' || k === 'Enter')) return;
  if (k === 'c' || k === 'C') { const n = selNode(); if (n) reveal(n, true); return; }
  if (k === '0') { setLevel(maxDepth); return; }
  if (k >= '1' && k <= '9') { setLevel(parseInt(k, 10)); return; }
  if (k === '[') { stepLevel(-1); return; }
  if (k === ']') { stepLevel(1); return; }
  if (k === 'e' || k === 'E') { const n = selNode(); if (n && n.kids.length) { n.open = false; toggle(n, true); } return; }
  if (k === ' ' || k === 'Enter') { const n = selNode(); if (n && n.kids.length && isVisible(n)) { ev.preventDefault(); toggle(n); } return; }
  if (k.slice(0, 5) === 'Arrow') { ev.preventDefault(); navKey(k); }
});

function togglePanel() { $('app').classList.toggle('nopanel'); }

/* ---------- wiring ---------- */

function resize() {
  const st = $('stage'), w = st.clientWidth, h1 = st.clientHeight;
  if (!w || !h1) return;
  const d = Math.min(2.5, window.devicePixelRatio || 1);
  if (w === W && h1 === H && d === dpr) return;
  W = w; H = h1; dpr = d;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  miniDirty = true;
  if (M) { if (rafId) { cancelAnimationFrame(rafId); rafId = 0; } frame(); }
}

function init() {
  buildControls();
  let theme = 'light';
  try { theme = localStorage.getItem('canopy-theme') || ''; } catch (e) { theme = ''; }
  if (theme !== 'light' && theme !== 'dark') theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  applyTheme(theme);
  resize();
  if (window.ResizeObserver) new ResizeObserver(resize).observe($('stage'));
  window.addEventListener('resize', resize);

  $('fileBtn').addEventListener('click', () => openPop($('fileBtn'), fileMenu));
  $('optBtn').addEventListener('click', () => openPop($('optBtn'), optMenu));
  $('expBtn').addEventListener('click', () => openPop($('expBtn'), expMenu));
  $('themeBtn').addEventListener('click', () => applyTheme(S.theme === 'dark' ? 'light' : 'dark'));
  $('helpBtn').addEventListener('click', helpDialog);
  $('panelToggle').addEventListener('click', togglePanel);
  $('panelHide').addEventListener('click', togglePanel);
  $('viewSeg').addEventListener('click', (ev) => { const b = ev.target.closest('button'); if (b && b.dataset.v !== S.view) { setView(b.dataset.v); renderPanel(); } });
  $('tabs').addEventListener('click', (ev) => { const b = ev.target.closest('[role=tab]'); if (b) { S.tab = b.dataset.tab; renderPanel(); } });
  $('file').addEventListener('change', (ev) => openFiles(ev.target.files));
  document.addEventListener('mousedown', (ev) => {
    if (pop && !pop.contains(ev.target) && !(popBtn && popBtn.contains(ev.target))) closePop();
    if (!$('searchWrap').contains(ev.target)) $('results').hidden = true;
  });

  const si = $('search');
  si.addEventListener('input', () => runSearch(si.value));
  si.addEventListener('focus', () => { if (si.value.trim()) { renderResults(si.value.trim().toLowerCase()); } });
  si.addEventListener('keydown', (ev) => {
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
      ev.preventDefault();
      if ($('results').hidden) { renderResults(si.value.trim().toLowerCase()); return; }
      if (!results.length) return;
      resActive = (resActive + (ev.key === 'ArrowDown' ? 1 : results.length - 1)) % results.length;
      markActive();
    } else if (ev.key === 'Enter') { ev.preventDefault(); if (results.length) goResult(resActive); }
  });

  let dragDepth = 0;
  const hasFiles = (ev) => ev.dataTransfer && Array.from(ev.dataTransfer.types || []).indexOf('Files') >= 0;
  window.addEventListener('dragenter', (ev) => { if (!hasFiles(ev)) return; ev.preventDefault(); dragDepth++; $('drop').hidden = false; });
  window.addEventListener('dragover', (ev) => { if (hasFiles(ev)) { ev.preventDefault(); ev.dataTransfer.dropEffect = 'copy'; } });
  window.addEventListener('dragleave', (ev) => { if (!hasFiles(ev)) return; dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $('drop').hidden = true; });
  window.addEventListener('drop', (ev) => { if (!hasFiles(ev)) return; ev.preventDefault(); dragDepth = 0; $('drop').hidden = true; if (modalClose) modalClose(); openFiles(ev.dataTransfer.files); });

  loadSample();
}

/* Test hook, only present when the page is opened with #debug. */
if (/[#?&]debug\b/.test(location.hash + location.search)) {
  window.canopyDebug = {
    info: () => ({ classes: M.classes.length, visible: vis.length, drawn: dn.length, zoom: cam.k, view: S.view, worker: usedWorker, sel: S.sel, depth: visibleDepth(), bounds: bounds, arcs: arcList.length }),
    frame: () => { if (rafId) { cancelAnimationFrame(rafId); rafId = 0; } anim = null; settle(); const t = performance.now(); frame(); return performance.now() - t; },
    overlaps: () => {
      const r = vis.map((n) => [n.nx - 7, n.ny - 8, n.nx + PADL + n.w + (n.kids.length && !n.open ? chipW(n) : 0), n.ny + 8]).sort((a, b) => a[1] - b[1]);
      let c = 0;
      for (let i = 0; i < r.length; i++) for (let j = i + 1; j < r.length && r[j][1] < r[i][3]; j++) if (r[j][0] < r[i][2] && r[j][2] > r[i][0]) c++;
      return c;
    },
    names: () => vis.slice(0, 60).map((n) => n.name)
  };
}
init();

})();
